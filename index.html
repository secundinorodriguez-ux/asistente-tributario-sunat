<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente Tributario SUNAT</title>
  
  <!-- Carga de Marked.js para interpretar sintaxis Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .chat-container {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 80vh;
    }
    .chat-header {
      background-color: #0b3c6d;
      color: white;
      padding: 15px;
      text-align: center;
    }
    .chat-header h2 { margin: 0; font-size: 1.2rem; }
    .chat-header p { margin: 5px 0 0; font-size: 0.85rem; opacity: 0.9; }
    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .user-message {
      background-color: #0b3c6d;
      color: white;
      align-self: flex-end;
    }
    .bot-message {
      background-color: #f0f2f5;
      color: #1c1e21;
      align-self: flex-start;
      border: 1px solid #e4e6eb;
    }

    /* Estilos para renderizar el Markdown correctamente */
    .bot-message h1, .bot-message h2, .bot-message h3 {
      margin-top: 10px;
      margin-bottom: 6px;
      color: #0b3c6d;
    }
    .bot-message h1 { font-size: 1.15rem; }
    .bot-message h2 { font-size: 1.05rem; }
    .bot-message h3 { font-size: 0.95rem; }
    .bot-message ul, .bot-message ol {
      margin: 6px 0;
      padding-left: 20px;
    }
    .bot-message p { margin: 4px 0; }

    .chat-input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #e4e6eb;
      background: #fff;
    }
    .chat-input-area input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }
    .chat-input-area button {
      background-color: #0b3c6d;
      color: white;
      border: none;
      padding: 10px 18px;
      margin-left: 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .chat-input-area button:hover { background-color: #082d52; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h2>Asistente Tributario SUNAT</h2>
    <p>Consultas sobre IGV, SPOT, Retenciones y Comprobantes</p>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="message bot-message">
      Hola, soy tu asistente tributario. ¿En qué consulta sobre normativa SUNAT, facturación o detracciones puedo ayudarte hoy?
    </div>
  </div>

  <div class="chat-input-area">
    <input type="text" id="userInput" placeholder="Escribe tu consulta tributaria aquí..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()">Enviar</button>
  </div>
</div>

<script>
  const WEBHOOK_URL = 'https://asistentetributariosecun.app.n8n.cloud/webhook/ASISTENTE';

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const message = input.value.trim();
    if (!message) return;

    appendMessage(message, 'user-message');
    input.value = '';

    const loadingDiv = appendMessage('Consultando normativa SUNAT...', 'bot-message');

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message })
      });

      const data = await response.json();
      const botResponse = typeof data === 'string' ? data : (data.output || data.response || JSON.stringify(data));

      // Renderiza Markdown a HTML real mediante marked.js
      loadingDiv.innerHTML = marked.parse(botResponse);

    } catch (error) {
      loadingDiv.innerText = 'Error al conectar con el servidor. Inténtalo de nuevo.';
      console.error(error);
    }
  }

  function appendMessage(text, className) {
    const chatBox = document.getElementById('chatBox');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${className}`;
    messageDiv.innerText = text;
    chatBox.appendChild(messageDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
    return messageDiv;
  }

  function handleKeyPress(event) {
    if (event.key === 'Enter') sendMessage();
  }
</script>

</body>
</html>
